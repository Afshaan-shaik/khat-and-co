<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" fill="none" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Kalam:wght@400;700&amp;display=swap');
      .brand-title {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 72px;
        fill: #1F2340;
      }
      .brand-amp {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        fill: #B4455A;
      }
      .brand-sub {
        font-family: 'Kalam', 'Instrument Sans', system-ui, sans-serif;
        font-size: 19px;
        letter-spacing: 0.5px;
        fill: #5C627D;
      }
    </style>
  </defs>

  <!-- Envelope icon (khat-mark) on the left -->
  <g transform="translate(0, 0)">
    <!-- Tilted envelope group -->
    <g transform="rotate(-6 65 72)">
      <!-- Envelope body -->
      <rect x="8" y="28" width="112" height="74" rx="7" fill="#F6EFE3" stroke="#1F2340" stroke-width="3.6" stroke-linejoin="round" />
      
      <!-- Top dashed airmail rose line -->
      <line x1="16" y1="39" x2="112" y2="39" stroke="#B4455A" stroke-width="2.6" stroke-dasharray="6 4.5" stroke-linecap="round" />
      
      <!-- Bottom dashed airmail blue line -->
      <line x1="16" y1="91" x2="112" y2="91" stroke="#3E5C8A" stroke-width="2.6" stroke-dasharray="6 4.5" stroke-linecap="round" />
      
      <!-- Diagonals -->
      <line x1="10" y1="100" x2="54" y2="67" stroke="#1F2340" stroke-width="2.8" stroke-linecap="round" />
      <line x1="118" y1="100" x2="76" y2="67" stroke="#1F2340" stroke-width="2.8" stroke-linecap="round" />
      
      <!-- Top flap fold -->
      <path d="M10 30 L65 67 L118 30" fill="none" stroke="#1F2340" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" />

      <!-- Wax Seal in center -->
      <circle cx="65" cy="67" r="12.5" fill="#B4455A" stroke="#1F2340" stroke-width="2.6" />
      
      <!-- Heart in seal -->
      <path d="M65 73 L63.8 71.8 C59.5 67.9 56.5 65.2 56.5 61.9 C56.5 59.2 58.5 57.2 61.2 57.2 C62.7 57.2 64.2 57.9 65 59 C65.8 57.9 67.3 57.2 68.8 57.2 C71.5 57.2 73.5 59.2 73.5 61.9 C73.5 65.2 70.5 67.9 66.2 71.8 L65 73 Z" fill="#F6EFE3" />
    </g>

    <!-- Floating hearts -->
    <!-- Top heart: light soft rose -->
    <g transform="translate(118, 12) rotate(-14) scale(0.6)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#E9B7C1" />
    </g>
    
    <!-- Middle heart: vibrant rich rose -->
    <g transform="translate(124, 34) rotate(18) scale(1.05)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#B4455A" />
    </g>
    
    <!-- Bottom heart: soft rose -->
    <g transform="translate(133, 72) rotate(10) scale(0.68)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D98A9A" />
    </g>
  </g>

  <!-- Brand Wordmark -->
  <text x="175" y="78" class="brand-title">Khat <tspan class="brand-amp">&amp;</tspan> Co.</text>
  
  <!-- Subtitle Tagline -->
  <text x="175" y="108" class="brand-sub">खत · letters for the people you miss</text>
</svg>
