<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" fill="none" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Kalam:wght@400;700&amp;display=swap');
      .brand-title {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 76px;
        fill: #1F2340;
      }
      .brand-amp {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        fill: #B4455A;
      }
      .brand-sub {
        font-family: 'Kalam', 'Instrument Sans', system-ui, sans-serif;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 0.4px;
        fill: #2C324E;
      }
      @media (prefers-color-scheme: dark) {
        .brand-title { fill: #FFFFFF; }
        .brand-amp { fill: #FF6B8B; }
        .brand-sub { fill: #F8F2E6; }
      }
    </style>
  </defs>

  <!-- Envelope icon on the left -->
  <g transform="translate(6, 4)">
    <!-- Tilted envelope group -->
    <g transform="rotate(-6 65 72)">
      <!-- Envelope body -->
      <rect x="8" y="26" width="114" height="76" rx="8" fill="#FAF5EB" stroke="#1F2340" stroke-width="3.6" stroke-linejoin="round" />
      
      <!-- Top dashed airmail rose line -->
      <line x1="16" y1="37" x2="114" y2="37" stroke="#B4455A" stroke-width="2.8" stroke-dasharray="6 4.5" stroke-linecap="round" />
      
      <!-- Bottom dashed airmail blue line -->
      <line x1="16" y1="91" x2="114" y2="91" stroke="#3E5C8A" stroke-width="2.8" stroke-dasharray="6 4.5" stroke-linecap="round" />
      
      <!-- Diagonals -->
      <line x1="10" y1="100" x2="55" y2="66" stroke="#1F2340" stroke-width="2.8" stroke-linecap="round" />
      <line x1="120" y1="100" x2="77" y2="66" stroke="#1F2340" stroke-width="2.8" stroke-linecap="round" />
      
      <!-- Top flap fold -->
      <path d="M10 28 L66 66 L120 28" fill="none" stroke="#1F2340" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" />

      <!-- Wax Seal in center -->
      <circle cx="66" cy="66" r="13" fill="#B4455A" stroke="#1F2340" stroke-width="2.8" />
      
      <!-- Heart in seal -->
      <path d="M66 72.5 L64.7 71.3 C60.2 67.2 57.1 64.4 57.1 61 C57.1 58.2 59.2 56.1 62 56.1 C63.6 56.1 65.1 56.8 66 58 C66.9 56.8 68.4 56.1 70 56.1 C72.8 56.1 74.9 58.2 74.9 61 C74.9 64.4 71.8 67.2 67.3 71.3 L66 72.5 Z" fill="#FAF5EB" />
    </g>

    <!-- Floating hearts -->
    <g transform="translate(122, 8) rotate(-14) scale(0.65)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#E9B7C1" />
    </g>
    
    <g transform="translate(128, 30) rotate(18) scale(1.12)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#B4455A" />
    </g>
    
    <g transform="translate(138, 70) rotate(10) scale(0.72)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D98A9A" />
    </g>
  </g>

  <!-- Brand Wordmark -->
  <text x="176" y="76" class="brand-title">Khath <tspan class="brand-amp">&amp;</tspan> Co.</text>
  
  <!-- Subtitle Tagline (expanded font size & bold) -->
  <text x="176" y="114" class="brand-sub">खत · letters for the people you miss</text>
</svg>
