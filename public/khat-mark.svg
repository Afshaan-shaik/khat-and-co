<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" fill="none" width="100%" height="100%">
  <!-- Tilted envelope group -->
  <g transform="rotate(-6 75 80)">
    <!-- Envelope body shadow & fill -->
    <rect x="12" y="32" width="126" height="82" rx="8" fill="#F6EFE3" stroke="#1F2340" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Top dashed airmail rose line -->
    <line x1="20" y1="44" x2="130" y2="44" stroke="#B4455A" stroke-width="2.8" stroke-dasharray="7 5" stroke-linecap="round" />
    
    <!-- Bottom dashed airmail blue line -->
    <line x1="20" y1="102" x2="130" y2="102" stroke="#3E5C8A" stroke-width="2.8" stroke-dasharray="7 5" stroke-linecap="round" />
    
    <!-- Diagonal envelope folds from bottom corners -->
    <line x1="14" y1="112" x2="63" y2="76" stroke="#1F2340" stroke-width="3" stroke-linecap="round" />
    <line x1="136" y1="112" x2="87" y2="76" stroke="#1F2340" stroke-width="3" stroke-linecap="round" />
    
    <!-- Flap fold lines meeting at center seal -->
    <path d="M14 34 L75 76 L136 34" fill="none" stroke="#1F2340" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Rose Wax Seal in center -->
    <circle cx="75" cy="76" r="14" fill="#B4455A" stroke="#1F2340" stroke-width="3" />
    
    <!-- Cream heart inside wax seal -->
    <path d="M75 82.5 L73.6 81.2 C68.8 76.8 65.5 73.8 65.5 70.1 C65.5 67.1 67.8 64.8 70.8 64.8 C72.5 64.8 74.1 65.6 75 66.8 C75.9 65.6 77.5 64.8 79.2 64.8 C82.2 64.8 84.5 67.1 84.5 70.1 C84.5 73.8 81.2 76.8 76.4 81.2 L75 82.5 Z" fill="#F6EFE3" />
  </g>

  <!-- Floating hearts on top right -->
  <!-- Top heart: small soft rose #E9B7C1 -->
  <g transform="translate(138, 12) rotate(-14) scale(0.65)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#E9B7C1" />
  </g>
  
  <!-- Middle heart: vibrant rich rose #B4455A -->
  <g transform="translate(142, 38) rotate(18) scale(1.15)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#B4455A" />
  </g>
  
  <!-- Bottom heart: soft rose #D98A9A -->
  <g transform="translate(154, 80) rotate(10) scale(0.75)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D98A9A" />
  </g>
</svg>
